<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronos — Schedule & Timetable Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="description" content="Personal Schedule, Habits & Timetable Tracker PWA" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('chronos_theme_mode');
          if (mode === 'light' || mode === 'light-gradient') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('theme-light-gradient');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('theme-light-gradient', 'theme-light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-emerald-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
