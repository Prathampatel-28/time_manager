<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main Outer Gradient -->
    <linearGradient id="chronos-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <!-- Inner Accent Gradient -->
    <linearGradient id="chronos-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#chronos-bg)" />

  <!-- Outer Chronometer Dial Arc -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="18" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#chronos-core)" stroke-width="18" stroke-dasharray="850 300" stroke-linecap="round" />

  <!-- Dial Ticks (12 o'clock, 3 o'clock, 6 o'clock, 9 o'clock) -->
  <line x1="256" y1="96" x2="256" y2="116" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  <line x1="416" y1="256" x2="396" y2="256" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="416" x2="256" y2="396" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  <line x1="96" y1="256" x2="116" y2="256" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />

  <!-- Center Stylized Hourglass / Chronos 'C' & Hands -->
  <path d="M 256 160 L 256 256 L 324 324" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Glowing Center Pivot Pin -->
  <circle cx="256" cy="256" r="20" fill="#ffffff" />

  <!-- Top Right Sparkle Star -->
  <polygon points="350,140 356,156 372,162 356,168 350,184 344,168 328,162 344,156" fill="#ffffff" opacity="0.9" />
</svg>