<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gh-brand-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="gh-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
  </defs>

  <!-- GitHub UI Container: Dark Charcoal with subtle GitHub border -->
  <rect width="512" height="512" rx="112" fill="url(#gh-brand-bg)" stroke="#30363d" stroke-width="12" />

  <!-- Outer Precision Dial Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#30363d" stroke-width="20" />
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#gh-accent-grad)" stroke-width="20" stroke-dasharray="750 300" stroke-dashoffset="-45" stroke-linecap="round" />

  <!-- GitHub Octicon Style Quadrant Ticks -->
  <circle cx="256" cy="116" r="10" fill="#f0f6fc" />
  <circle cx="396" cy="256" r="10" fill="#f0f6fc" />
  <circle cx="256" cy="396" r="10" fill="#f0f6fc" />
  <circle cx="116" cy="256" r="10" fill="#f0f6fc" />

  <!-- Clean Precision Hands -->
  <path d="M 256 160 L 256 256 L 330 256" fill="none" stroke="#f0f6fc" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

  <!-- GitHub Accent Pivot Node -->
  <circle cx="256" cy="256" r="24" fill="#3fb950" stroke="#0d1117" stroke-width="8" />

  <!-- Top Right Octicon Node Spark -->
  <circle cx="348" cy="164" r="12" fill="#58a6ff" />
</svg>